# Envoy config with the bug-fix runtime guard ON (the shipped default) -> the body
# is forwarded intact. This is the fixed behavior for issue #46841.
layered_runtime:
  layers:
  - name: static_layer
    static_layer:
      envoy.reloadable_features.filter_manager_forward_added_data_on_continue: true

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address: { address: 0.0.0.0, port_value: 10000 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: echo }
          http_filters:
          # Same deterministic trigger; with the guard ON the buffered frame is forwarded.
          - name: envoy.filters.http.drain_and_continue
            typed_config:
              "@type": type.googleapis.com/google.protobuf.Struct
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: echo
    type: STRICT_DNS
    load_assignment:
      cluster_name: echo
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: echo, port_value: 8080 }
